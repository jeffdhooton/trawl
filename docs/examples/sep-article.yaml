# Stanford Encyclopedia of Philosophy article schema.
#
# Extracts the structured pieces of a /entries/<slug>/ page:
# title, publication info, table of contents, related entries,
# author, and copyright line. Tested against plato.stanford.edu/entries/kant/
# during development (11 TOC entries, 24 related entries, author
# "Michael Rohlf"), then validated against the full 1857-entry SEP
# corpus on 2026-04-11 (100% reach, 0 failures, 2h34m wall clock).
#
# Usage:
#   trawl scrape https://plato.stanford.edu/entries/kant/ \
#     --schema docs/examples/sep-article.yaml \
#     --format markdown --readability -o kant.jsonl
#
# Relative hrefs (e.g. "../aesthetics/") are intentionally preserved —
# trawl does not resolve them. Join against record.canonical_url if you
# need absolute URLs downstream.
#
# Known limitation: plain-text authors in older entries
# ─────────────────────────────────────────────────────
# The `author` selector below matches only LINKED authors — entries
# where the copyright block wraps the name in an <a href="http://..."
# target="other">. That's the modern style and covers most entries.
#
# Older or simpler entries use a plain-text author (name + email after
# a <br/> inside #article-copyright, no wrapping anchor). Those miss
# this selector entirely. On the full 1857-entry corpus this was a
# ~34% miss rate — ~635 entries needed offline backfill.
#
# v1 schema doesn't yet support fallback selectors or regex
# post-processing, so the working pattern is: run trawl with this
# schema, then post-process the JSONL with a small script that regex-
# extracts the author+email from the markdown body for any record
# where `extracted.author` is missing. See
# `~/workspace/datasets/sep/enrich.py` for the reference implementation.
#
# If you have this papercut too, that's a v2 schema signal — fallback
# selectors (`selector: [primary, fallback]`) or a transform step
# would eliminate the need for offline enrichment. See the "v2 schema
# features (pending consumer signal)" section in docs/ROADMAP.md.

version: 1
fields:
  title:
    selector: "h1"

  pubinfo:
    selector: "#pubinfo em"

  toc_entries:
    selector: "#toc > ul > li > a"
    multiple: true
    fields:
      text:
        selector: ""
      anchor:
        selector: ""
        attr: "href"

  related_entries:
    selector: "#related-entries p a"
    multiple: true
    fields:
      title:
        selector: ""
      href:
        selector: ""
        attr: "href"

  author:
    selector: "#article-copyright a[href^='http']"

  copyright:
    selector: "#article-copyright a[href*='info.html']"
